[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# Single-page app: let the client render unknown paths.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cesium's runtime assets are versioned by package; cache them aggressively.
[[headers]]
  for = "/cesium/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Boundary payloads are rebuilt on deploy; a day of caching keeps repeat
# visits fast without pinning a stale dataset for a week.
[[headers]]
  for = "/geo/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
